services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: development
      SEARXNG_BASE_URL: http://localhost:8080
      SEARXNG_TIMEOUT_SECONDS: 20
      CRAWL_TIMEOUT_SECONDS: 30
      CRAWL_MAX_CONCURRENCY: 4
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      searxng:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode())" ]
      interval: 10s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng
    environment:
      INSTANCE_NAME: Quarry
      BASE_URL: http://localhost:8080/
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8080/').status)" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
