name: Benchmark

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual run trigger'
        required: false
        default: 'Manual test'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SEARXNG_BASE_URL: http://127.0.0.1:8080

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Start SearXNG with custom config
        run: |
          mkdir -p ${{ github.workspace }}/searxng
          cat <<EOF > ${{ github.workspace }}/searxng/settings.yml
          search:
            formats:
              - html
              - json
          server:
            port: 8080
            bind_address: "0.0.0.0"
            secret_key: "quarry-benchmark-secret"
          EOF
          chmod 644 ${{ github.workspace }}/searxng/settings.yml
          
          docker run -d \
            --name searxng \
            -p 8080:8080 \
            -v ${{ github.workspace }}/searxng/settings.yml:/etc/searxng/settings.yml:ro \
            searxng/searxng:latest

      - name: Verify Tavily API Key Presence & Direct Test
        run: |
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "❌ ERROR: TAVILY_API_KEY is empty! Move it to Repository Secrets or specify 'environment' in job."
            exit 1
          else
            echo "✅ TAVILY_API_KEY is set (length: ${#TAVILY_API_KEY})"
          fi

          echo "Testing direct connection to Tavily API..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://api.tavily.com/search \
            -H "Content-Type: application/json" \
            -d "{\"api_key\": \"$TAVILY_API_KEY\", \"query\": \"test\"}")
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Tavily API authentication successful (HTTP 200)"
          else
            echo "❌ Tavily API returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: uv sync --locked

      - name: Wait for SearXNG
        run: |
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:8080 > /dev/null; then
              echo "✅ SearXNG ready"
              exit 0
            fi
            echo "Waiting for SearXNG... ($i)"
            sleep 1
          done
          
          echo "❌ SearXNG not ready"
          docker logs searxng
          
      - name: Debug SearXNG JSON Endpoint
        run: |
          echo "Testing direct query to SearXNG JSON API..."
          curl -s "http://127.0.0.1:8080/search?q=python&format=json" | head -c 1000
          echo ""

      - name: Start API
        run: |
          set -e

          uv run uvicorn api.app:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          PID=$!

          echo "Started API with PID $PID"

          for i in {1..60}; do
            if ! kill -0 $PID 2>/dev/null; then
              echo "❌ API process crashed"
              cat uvicorn.log
              exit 1
            fi

            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "✅ API ready"
              exit 0
            fi

            echo "Waiting for API... ($i)"
            sleep 1
          done

          echo "❌ API did not become ready in time"
          cat uvicorn.log
          exit 1
          
      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== SearXNG Container Logs ==="
          docker logs searxng
          echo "=== Uvicorn Logs ==="
          cat uvicorn.log

      - name: Run benchmark
        run: uv run python scripts/benchmark.py

      - name: Show API logs
        if: always()
        run: cat uvicorn.log