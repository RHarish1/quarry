name: Benchmark

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual run trigger'
        required: false
        default: 'Manual test'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    env:
      REDIS_URL: redis://localhost:6379/0
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SEARXNG_URL: http://localhost:8080

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Start SearXNG with custom config
        run: |
          # ✅ Start SearXNG after checkout so we can mount settings.yml
          docker run -d \
            --name searxng \
            -p 8080:8080 \
            -v ${{ github.workspace }}/searxng/settings.yml:/etc/searxng/settings.yml \
            searxng/searxng:latest

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: uv sync --locked

      - name: Wait for SearXNG
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "✅ SearXNG ready"
              exit 0
            fi
            echo "Waiting for SearXNG... ($i)"
            sleep 1
          done
          
          echo "❌ SearXNG not ready"
          
      - name: Debug SearXNG response
        run: |
          curl -s "http://localhost:8080/search?q=python&format=json" | head -c 1000

      - name: Start API
        run: |
          set -e

          uv run uvicorn api.app:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          PID=$!

          echo "Started API with PID $PID"

          # Wait for readiness (max 60s)
          for i in {1..60}; do
            # Check if process died
            if ! kill -0 $PID 2>/dev/null; then
              echo "❌ API process crashed"
              cat uvicorn.log
              exit 1
            fi

            # Strict health check
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "✅ API ready"
              exit 0
            fi

            echo "Waiting for API... ($i)"
            sleep 1
          done

          echo "❌ API did not become ready in time"
          cat uvicorn.log
          exit 1
          
      - name: Show API logs if failed
        if: failure()
        run: cat uvicorn.log

      - name: Run benchmark
        run: uv run python scripts/benchmark.py

      - name: Show API logs
        run: cat uvicorn.log