[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry"
version = "1.0.0"
description = "LLM-native retrieval backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.137",
  "httpx>=0.27,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "redis>=5.0,<6.0",
  "beautifulsoup4>=4.12,<5.0",
  "fastapi-limiter==0.1.6",
  "markdownify>=1.2.3",
  "playwright>=1.45,<2.0",
  "readability-lxml>=0.8.1,<1.0",
  "trafilatura>=1.9,<2.0",
  "typing-extensions>=4.16.0",
  "prometheus-fastapi-instrumentator>=8.1.0",
  "ddgs>=8.1.1",
]

[project.optional-dependencies]
dev = [
  "black>=24.0,<25.0",
  "ruff>=0.6,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["api*", "config*", "pipeline*", "models*", "utils*", "benchmarks*", "tests*", "scripts*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
