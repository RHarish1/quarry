global:
  scrape_interval: 10s # Scrape your API every 10 seconds

scrape_configs:
  - job_name: 'quarry-api'
    static_configs:
      # If FastAPI is running locally on your machine, use host.docker.internal 
      # (If you are on native Linux, use your machine's actual local IP address)
      - targets: ['api:8000']